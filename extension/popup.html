<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield Real-Time Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 360px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: #2563eb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-family: monospace;
      color: #38bdf8;
      background: #082f49;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #0369a1;
      font-weight: 700;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
    .url-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .url-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .url-text {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      word-break: break-all;
      line-height: 1.4;
      max-height: 48px;
      overflow-y: auto;
    }
    .verdict-card {
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .verdict-card.safe {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.4), rgba(15, 23, 42, 0.8));
      border-color: #059669;
    }
    .verdict-card.suspicious {
      background: linear-gradient(135deg, rgba(120, 53, 15, 0.4), rgba(15, 23, 42, 0.8));
      border-color: #d97706;
    }
    .verdict-card.dangerous {
      background: linear-gradient(135deg, rgba(127, 29, 29, 0.4), rgba(15, 23, 42, 0.8));
      border-color: #dc2626;
    }
    .verdict-badge {
      display: inline-block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .verdict-card.safe .verdict-badge { color: #34d399; }
    .verdict-card.suspicious .verdict-badge { color: #fbbf24; }
    .verdict-card.dangerous .verdict-badge { color: #f87171; }

    .score-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      margin-top: 4px;
    }
    .score-num {
      font-size: 26px;
      font-weight: 900;
      font-family: monospace;
    }
    .score-max {
      font-size: 12px;
      color: #94a3b8;
    }
    .ml-info-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .ml-header {
      display: flex;
      justify-content: space-between;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .ml-pred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ml-confidence {
      font-family: monospace;
      font-weight: 700;
      color: #38bdf8;
    }
    .footer-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-rescan {
      background: #0284c7;
      color: #fff;
    }
    .btn-rescan:hover {
      background: #0369a1;
    }
    .btn-dashboard {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-dashboard:hover {
      background: #475569;
    }
    .loading-state {
      padding: 24px 0;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛡</div>
      <span class="brand-title">CyberShield</span>
    </div>
    <div class="live-badge">
      <div class="pulse-dot"></div>
      REAL-TIME
    </div>
  </div>

  <div class="url-card">
    <div class="url-label">Active Web Destination:</div>
    <div id="active-url" class="url-text">Inspecting active tab...</div>
  </div>

  <div id="loading" class="loading-state">
    Connecting to CyberShield AI-ML Engine (Port 8085)...
  </div>

  <div id="results" style="display: none;">
    <div id="verdict-card" class="verdict-card safe">
      <div id="verdict-text" class="verdict-badge">SAFE</div>
      <div class="score-row">
        <span class="score-num" id="risk-score">0.0</span>
        <span class="score-max">/ 15.0 Risk</span>
      </div>
    </div>

    <div class="ml-info-box">
      <div class="ml-header">
        <span>AI / MACHINE LEARNING</span>
        <span>KAGGLE ENSEMBLE</span>
      </div>
      <div class="ml-pred-row">
        <span>Prediction: <strong id="ml-prediction" style="color: #34d399;">LEGITIMATE</strong></span>
        <span class="ml-confidence" id="ml-confidence">98.5%</span>
      </div>
    </div>
  </div>

  <div class="footer-actions">
    <button id="btn-recheck" class="btn btn-rescan">Re-Scan URL</button>
    <button id="btn-open-dash" class="btn btn-dashboard">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
